name: Build Android APK

# 触发条件
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:  # 允许手动触发
    inputs:
      build_type:
        description: '构建类型'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

# 环境变量
env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # 2. 设置 Node.js
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. 安装 pnpm
      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # 4. 安装依赖
      - name: 📦 Install dependencies
        run: |
          cd client
          pnpm install

      # 5. 安装 EAS CLI
      - name: 🔧 Install EAS CLI
        run: npm install -g eas-cli

      # 6. 获取构建类型
      - name: 🔍 Get build type
        id: build_type
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BUILD_TYPE="${{ github.event.inputs.build_type }}"
          else
            BUILD_TYPE="preview"
          fi
          echo "type=$BUILD_TYPE" >> $GITHUB_OUTPUT
          echo "构建类型: $BUILD_TYPE"

      # 7. 配置 Git 用户信息（用于 EAS）
      - name: 📝 Setup Git
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"

      # 8. 使用 EAS Build 构建 APK
      - name: 🏗️ Build Android APK with EAS
        id: eas_build
        run: |
          cd client

          # 使用 EAS CLI 进行构建（非交互模式，等待完成）
          eas build \
            --platform android \
            --profile ${{ steps.build_type.outputs.type }} \
            --non-interactive \
            --wait

          echo "构建完成！"

      # 9. 生成构建报告
      - name: 📝 Create build report
        run: |
          cd client

          BUILD_TYPE="${{ steps.build_type.outputs.type }}"

          cat > build-report.md << EOF
          # Android APK 构建报告

          ## 📱 构建信息

          - **应用名称**: 联智记帐
          - **版本**: 1.0.0
          - **构建类型**: $BUILD_TYPE
          - **构建时间**: $(date '+%Y-%m-%d %H:%M:%S')
          - **触发方式**: ${{ github.event_name }}

          ## 📥 下载方式

          ### 方式一：EAS 构建页面
          访问你的 Expo 账户构建页面查看构建历史和下载链接。

          ### 方式二：GitHub Actions
          点击下方的 "Summary" 查看构建详情

          ## 📲 安装说明

          1. 访问 EAS 构建页面
          2. 找到最新的构建记录
          3. 点击下载 APK 文件
          4. 传输到 Android 手机
          5. 在手机上点击 APK 文件安装
          6. 允许安装未知来源应用

          ## ✅ 功能验证

          安装后请验证：
          - [ ] 应用正常启动
          - [ ] 项目管理功能正常
          - [ ] 支出记录功能正常
          - [ ] 收款/开票记录功能正常
          - [ ] 数据导出/导入功能正常
          - [ ] 关闭应用后重新打开，数据仍然存在

          ## 💡 数据备份

          应用数据存储在本地，请定期使用"数据导出"功能备份数据。

          ---
          构建由 GitHub Actions 自动生成
          EOF

          cat build-report.md

      # 10. 上传构建报告
      - name: 📤 Upload build report
        uses: actions/upload-artifact@v4
        with:
          name: build-report-${{ steps.build_type.outputs.type }}
          path: client/build-report.md
          retention-days: 30

      # 11. 发送构建通知
      - name: 📢 Build notification
        run: |
          echo "========================================"
          echo "  构建完成！"
          echo "========================================"
          echo "构建类型: ${{ steps.build_type.outputs.type }}"
          echo "构建状态: 成功"
          echo "APK文件: 已上传到 Artifacts"
          echo "构建报告: 已上传到 Artifacts"
          echo "========================================"
