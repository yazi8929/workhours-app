## 🔍 查看构建日志

### 查看详细日志

1. 访问构建页面
2. 点击任意步骤（如 "Build APK"）
3. 查看详细的构建输出

### 常见问题排查

**构建失败时，检查：**
- ✅ Node.js 版本是否为 18
- ✅ JDK 版本是否为 17
- ✅ 依赖是否正确安装
- ✅ Android SDK 许可是否接受

---

## ❓ 常见问题

### Q: 构建失败了怎么办？

**A:**
1. 查看构建日志，找到错误信息
2. 常见问题：
   - 依赖安装失败 → 检查 package.json
   - Gradle 构建失败 → 查看详细错误信息
   - 超时 → Release 版本可能需要更长时间

### Q: 构建时间太长？

**A:**
- 首次构建需要下载依赖，较慢
- 后续构建会使用缓存，速度会快很多
- Debug 版本比 Release 版本快

### Q: APK 文件在哪里？

**A:**
- 构建完成后，APK 会自动上传到 GitHub Artifacts
- 在构建页面的 "Artifacts" 部分下载

### Q: 可以修改 APK 文件名吗？

**A:**
- 可以，修改工作流中的重命名步骤
- 当前格式：`workhours-app-{类型}-{时间戳}.apk`

### Q: 需要配置任何 Secrets 吗？

**A:**
- ❌ 不需要！
- 这个工作流完全不需要任何 Secrets 或 Token

