name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install dependencies
        run: |
          cd client
          npm install

      - name: Prebuild Android project
        run: |
          cd client
          npx expo prebuild --platform android --clean

      - name: Build Release APK
        run: |
          cd client/android
          chmod +x gradlew
          export GRADLE_OPTS="-Xmx6g -Xms2g"
          ./gradlew assembleRelease --stacktrace

      - name: Find APK files
        if: always()
        run: |
          echo "=========================================="
          echo "Searching for APK files..."
          echo "=========================================="
          find client/android -name "*.apk" 2>/dev/null || echo "No APK files found"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workhours-app-release
          path: |
            client/android/app/build/outputs/apk/release/*.apk
            client/android/app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: warn
