name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          cd client
          npm install

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Prebuild Android project
        run: |
          cd client
          npx expo prebuild --platform android --clean

      - name: Build APK
        id: build
        continue-on-error: true
        run: |
          cd client/android
          chmod +x gradlew
          export GRADLE_OPTS="-Xmx6g -Xms2g"
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Show build errors
        if: steps.build.outputs.exit_code != '0'
        run: |
          echo "=========================================="
          echo "BUILD FAILED - SEARCHING FOR ERRORS..."
          echo "=========================================="
          echo ""
          echo "--- Lines containing 'FAILURE' ---"
          grep -i "FAILURE" client/android/build.log || echo "No 'FAILURE' found"
          echo ""
          echo "--- Lines containing 'What went wrong' ---"
          grep -i "What went wrong" client/android/build.log || echo "No 'What went wrong' found"
          echo ""
          echo "--- Lines containing 'Execution failed' ---"
          grep -i "Execution failed" client/android/build.log || echo "No 'Execution failed' found"
          echo ""
          echo "--- Lines containing 'error:' ---"
          grep -i "error:" client/android/build.log || echo "No 'error:' found"
          echo ""
          echo "--- Lines containing 'failed:' ---"
          grep -i "failed" client/android/build.log || echo "No 'failed' found"
          echo ""
          echo "--- Lines containing 'exception:' ---"
          grep -i "exception" client/android/build.log || echo "No 'exception' found"
          echo ""
          echo "--- Lines containing 'Could not' ---"
          grep -i "Could not" client/android/build.log || echo "No 'Could not' found"
          echo ""
          echo "--- Lines containing 'Duplicate' ---"
          grep -i "Duplicate" client/android/build.log || echo "No 'Duplicate' found"
          echo ""
          echo "--- Lines containing 'Cannot' ---"
          grep -i "Cannot" client/android/build.log || echo "No 'Cannot' found"
          echo ""
          echo "--- Last 100 lines ---"
          tail -n 100 client/android/build.log
          echo ""
          echo "=========================================="
          exit 1

      - name: Find APK files
        if: always()
        run: |
          echo "Searching for APK files..."
          find client/android -name "*.apk" || echo "No APK files found"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workhours-app-debug
          path: |
            client/android/app/build/outputs/apk/debug/*.apk
            client/android/app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: warn
