name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Remove problematic dependencies
        run: |
          cd client
          npm uninstall react-native-chart-kit expo-splash-screen expo-location expo-camera react-native-keyboard-aware-scroll-view || true
          rm -rf node_modules package-lock.json
          npm install

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Prebuild Android project
        run: |
          cd client
          npx expo prebuild --platform android --clean

      - name: Build APK
        continue-on-error: true
        run: |
          cd client/android
          chmod +x gradlew
          export GRADLE_OPTS="-Xmx6g -Xms2g"
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: client/android/build.log
          retention-days: 1

      - name: Find APK files
        if: always()
        run: |
          echo "Searching for APK files..."
          find client/android -name "*.apk" || echo "No APK files found"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workhours-app-debug
          path: |
            client/android/app/build/outputs/apk/debug/*.apk
            client/android/app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: warn
