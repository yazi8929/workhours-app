name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Fix package.json dependencies
        run: |
          cd client
          # 移除所有有问题的依赖
          sed -i '/react-native-reanimated/d' package.json
          sed -i '/react-native-chart-kit/d' package.json
          sed -i '/expo-splash-screen/d' package.json
          sed -i '/expo-location/d' package.json
          sed -i '/expo-camera/d' package.json
          sed -i '/react-native-keyboard-aware-scroll-view/d' package.json
          sed -i '/react-native-worklets/d' package.json
          echo "=== Fixed package.json ==="
          cat package.json | grep -A 50 '"dependencies"'
          
      - name: Fix babel.config.js
        run: |
          cd client
          # 移除 react-native-reanimated/plugin
          sed -i "/react-native-reanimated\/plugin/d" babel.config.js
          echo "=== Fixed babel.config.js ==="
          cat babel.config.js

      - name: Install dependencies
        run: |
          cd client
          rm -rf node_modules package-lock.json
          npm install

      - name: Create node_modules symlink for Metro
        run: |
          # Metro bundler 在项目根目录查找 node_modules
          # 创建符号链接指向 client/node_modules
          ln -s client/node_modules node_modules
          echo "Created node_modules symlink"
          ls -la node_modules | head -5

      - name: Prebuild Android project
        run: |
          cd client
          npx expo prebuild --platform android --clean

      - name: Build Release APK
        id: build
        continue-on-error: true
        run: |
          cd client/android
          chmod +x gradlew
          export GRADLE_OPTS="-Xmx6g -Xms2g"
          ./g
