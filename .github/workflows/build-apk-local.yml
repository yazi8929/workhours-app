## 🎯 构建类型说明

### Debug APK（推荐日常使用）

**特点：**
- 🚀 构建快速（约 5-10 分钟）
- 📦 文件较大
- 🔍 包含调试信息
- ✅ 适合测试和预览

**使用场景：**
- 日常开发测试
- 快速验证功能
- 分发给测试人员

### Release APK（正式发布）

**特点：**
- ⏱️ 构建较慢（约 15-20 分钟）
- 📦 文件较小
- 🎯 已优化和压缩
- ✅ 适合正式发布

**使用场景：**
- 正式发布给用户
- 生产环境使用
- 需要最佳性能

---

## 🔄 自动触发构建

除了手动触发，你也可以设置代码推送时自动构建：

### 方法1：当前配置（已启用）

工作流已经配置为在推送到 `main` 或 `master` 分支时自动构建。

### 方法2：禁用自动触发

如果只想手动触发，修改工作流文件的触发条件：

```yaml
on:
  workflow_dispatch:  # 只保留手动触发
    inputs:
      build_type:
        description: '构建类型'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
```

