name: Build Android APK (Local)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 🔧 Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 💾 Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            client/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: 💾 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 📦 Install dependencies
        run: |
          cd client
          npm install

      - name: 🔧 Install Expo CLI
        run: npm install -g expo-cli

      - name: 📜 Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: 🏗️ Prebuild Android project
        run: |
          cd client
          echo "开始 Expo Prebuild..."
          npx expo prebuild --platform android --clean
          echo "Prebuild 完成"
          ls -la android/ || echo "android 目录不存在"

      - name: 🏗️ Build APK
        id: build
        run: |
          cd client/android

          # 设置默认构建类型
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          if [ -z "$BUILD_TYPE" ]; then
            BUILD_TYPE="debug"
          fi

          echo "=========================================="
          echo "构建类型: $BUILD_TYPE"
          echo "=========================================="
          echo "当前目录: $(pwd)"
          echo "Gradle 版本:"
          ./gradlew --version
          echo "=========================================="

          # 检查项目结构
          echo "检查项目结构..."
          ls -la app/build.gradle || echo "app/build.gradle 不存在"
          ls -la settings.gradle || echo "settings.gradle 不存在"

          if [ "$BUILD_TYPE" = "release" ]; then
            echo "构建 Release APK..."
            ./gradlew assembleRelease --stacktrace --info || true
            APK_PATH="app/build/outputs/apk/release/app-release.apk"
          else
            echo "构建 Debug APK..."
            ./gradlew assembleDebug --stacktrace --info || true
            APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          fi

          echo "=========================================="
          echo "查找生成的 APK 文件..."
          echo "=========================================="
          find app/build/outputs -name "*.apk" -type f || echo "未找到 APK 文件"

          echo "=========================================="
          echo "检查 APK 路径: $APK_PATH"
          echo "=========================================="

          # 检查 APK 文件是否存在
          if [ ! -f "$APK_PATH" ]; then
            echo "错误: APK 文件不存在！"
            echo "输出目录内容:"
            ls -la app/build/outputs/apk/ || true
            exit 1
          fi

          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
          echo "build_type=$BUILD_TYPE" >> $GITHUB_OUTPUT

          ls -lh $APK_PATH

      - name: 📝 Rename APK
        run: |
          BUILD_TYPE="${{ steps.build.outputs.build_type }}"
          if [ -z "$BUILD_TYPE" ]; then
            BUILD_TYPE="debug"
          fi

          VERSION=$(date +%Y%m%d-%H%M%S)
          NEW_NAME="workhours-app-${BUILD_TYPE}-${VERSION}.apk"

          cp ${{ env.APK_PATH }} $NEW_NAME
          echo "NEW_APK_NAME=$NEW_NAME" >> $GITHUB_ENV

          echo "重命名后的文件: $NEW_NAME"
          ls -lh $NEW_NAME

      - name: 📤 Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NEW_APK_NAME }}
          path: ${{ env.NEW_APK_NAME }}
          retention-days: 30

      - name: 📝 Create build report
        run: |
          BUILD_TYPE="${{ steps.build.outputs.build_type }}"
          if [ -z "$BUILD_TYPE" ]; then
            BUILD_TYPE="debug"
          fi

          cat > build-report.md << EOF
          # Android APK 构建报告

          ## 📱 构建信息

          - **应用名称**: ProjectAccountingApp
          - **包名**: com.anonymous.x7613422460242919487
          - **版本**: 1.0.0
          - **构建类型**: $BUILD_TYPE
          - **构建时间**: $(date '+%Y-%m-%d %H:%M:%S')
          - **触发方式**: ${{ github.event_name }}
          - **构建方式**: 本地构建（GitHub Actions + Gradle）

          ## 📥 下载方式

          ### GitHub Artifacts（推荐）

          1. 访问此构建页面
          2. 向下滚动到 "Artifacts" 部分
          3. 下载 **${{ env.NEW_APK_NAME }}**

          ## 📲 安装说明

          1. 下载 APK 文件
          2. 传输到 Android 手机
          3. 在手机上点击 APK 文件安装
          4. 允许安装未知来源应用

          ## ✅ 功能验证

          安装后请验证：
          - [ ] 应用正常启动
          - [ ] 项目管理功能正常
          - [ ] 支出记录功能正常
          - [ ] 收款/开票记录功能正常
          - [ ] 数据导出/导入功能正常

          ## 💡 数据备份

          应用数据存储在本地，请定期使用"数据导出"功能备份数据。

          ---
          构建由 GitHub Actions 自动生成（本地构建模式）
          EOF

          cat build-report.md

      - name: 📤 Upload build report
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: build-report.md
          retention-days: 30

      - name: ✅ Build success
        run: |
          echo "========================================"
          echo "  构建成功！"
          echo "========================================"
          echo "APK 文件: ${{ env.NEW_APK_NAME }}"
          echo "构建类型: ${{ steps.build.outputs.build_type }}"
          echo "下载位置: GitHub Actions → Artifacts"
          echo "========================================"
